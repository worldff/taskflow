# TaskFlow full stack: frontend (React + Nginx) -> backend (Flask API) -> db (PostgreSQL)
# Docker : docker compose up -d --build
# Podman : podman-compose up -d --build   (atau: podman compose up -d --build)
services:
  db:
    image: docker.io/library/postgres:16-alpine
    container_name: taskflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskflow}
      POSTGRES_USER: ${POSTGRES_USER:-taskflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskflow} -d ${POSTGRES_DB:-taskflow}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend-net]

  backend:
    image: ${BACKEND_IMAGE:-taskflow-backend:local}
    build:
      context: ./backend
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
    container_name: taskflow-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-taskflow}:${POSTGRES_PASSWORD:-taskflow}@db:5432/${POSTGRES_DB:-taskflow}
      SECRET_KEY: ${SECRET_KEY:-ganti-dengan-secret-acak}
      APP_ENV: ${APP_ENV:-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@taskflow.id}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    expose:
      - "5000"
    networks: [backend-net, frontend-net]

  frontend:
    image: ${FRONTEND_IMAGE:-taskflow-frontend:local}
    build:
      context: ./frontend
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
    container_name: taskflow-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:5000
    ports:
      - "${APP_PORT:-8080}:80"
    networks: [frontend-net]

volumes:
  pgdata:

# Database hanya bisa dijangkau backend; frontend hanya bisa menjangkau backend.
networks:
  backend-net:
  frontend-net:
